services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jupyter
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-senha123}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB=${MYSQL_DATABASE:-meu_banco}
      - MYSQL_USER=${MYSQL_USER:-usuario}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-senha123}
    volumes:
      - ./notebooks:/home/jovyan/work
    networks:
      - jupyter-net
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-meu_banco}
      - MYSQL_USER=${MYSQL_USER:-usuario}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-senha123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - jupyter-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

networks:
  jupyter-net:
    driver: bridge
